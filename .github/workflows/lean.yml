name: Leanify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Build the checker and certify the example articles
        run: lake build leanify Demo Means TailDependence Refuted Notation Vocabulary Fields Calculus PDE Conventions Statements Arguments Notions
      - name: Quick check of the example articles
        run: |
          lake exe leanify check examples/Means/article.tex --claims --prose
                    lake exe leanify check tests/TailDependence/article.tex --vocab unitsquare --claims --prose
      - name: The draft of the getting-started guide gives the findings the guide shows
        run: |
          lake exe leanify check examples/Demo/draft.tex > "$RUNNER_TEMP/draft.check.txt" || true
          diff examples/Demo/draft.check.txt "$RUNNER_TEMP/draft.check.txt"
      - name: Notions defined in the running text are read as documented
        run: |
          lake exe leanify check tests/Notions/article.tex --vocab unitsquare --claims > "$RUNNER_TEMP/notions.check.txt"
          diff tests/Notions/check.txt "$RUNNER_TEMP/notions.check.txt"
      - name: Notation beyond the core grammar is read as documented
        run: |
          lake exe leanify check tests/Notation/article.tex --claims > "$RUNNER_TEMP/notation.check.txt"
          diff tests/Notation/check.txt "$RUNNER_TEMP/notation.check.txt"
      - name: The article's notation and conventions and a field of the vocabulary are read as documented
        run: |
          lake exe leanify check tests/Vocabulary/article.tex --vocab distributions --claims > "$RUNNER_TEMP/vocabulary.check.txt"
          diff tests/Vocabulary/check.txt "$RUNNER_TEMP/vocabulary.check.txt"
      - name: Functions of several variables and partial derivatives are read as documented
        run: |
          lake exe leanify check tests/Calculus/article.tex --claims > "$RUNNER_TEMP/calculus.check.txt"
          diff tests/Calculus/check.txt "$RUNNER_TEMP/calculus.check.txt"
      - name: The glossary of the vocabulary is up to date
        run: |
          lake build glossary
          lake exe glossary > "$RUNNER_TEMP/glossary.md"
          diff docs/glossary.md "$RUNNER_TEMP/glossary.md"
      - name: The fields numbers and torus, generic constants and existence are read as documented
        run: |
          lake exe leanify check tests/Fields/article.tex --vocab numbers,torus,hyperbolic --claims > "$RUNNER_TEMP/fields.check.txt" || true
          diff tests/Fields/check.txt "$RUNNER_TEMP/fields.check.txt"
      - name: Fields, norms and the Navier–Stokes equations are read as documented
        run: |
          lake exe leanify check tests/PDE/article.tex --claims > "$RUNNER_TEMP/pde.check.txt"
          diff tests/PDE/check.txt "$RUNNER_TEMP/pde.check.txt"
      - name: Conventions about constants, multi-indices and classes of functions are read as documented
        run: |
          lake exe leanify check tests/Conventions/article.tex --vocab numbers --claims > "$RUNNER_TEMP/conventions.check.txt" || true
          diff tests/Conventions/check.txt "$RUNNER_TEMP/conventions.check.txt"
      - name: Statement forms of research manuscripts are read as documented
        run: |
          lake exe leanify check tests/Statements/article.tex --vocab numbers,complex --claims > "$RUNNER_TEMP/statements.check.txt" || true
          diff tests/Statements/check.txt "$RUNNER_TEMP/statements.check.txt"
      - name: Assumptions, cases, contradictions and inductions of proofs are read as documented
        run: |
          lake exe leanify check tests/Arguments/article.tex --vocab numbers --claims > "$RUNNER_TEMP/arguments.check.txt" || true
          diff tests/Arguments/check.txt "$RUNNER_TEMP/arguments.check.txt"
      - name: An article in several files is read with the files it inputs
        run: |
          lake exe leanify check tests/Inputs/article.tex --claims > "$RUNNER_TEMP/inputs.check.txt" || true
          diff tests/Inputs/check.txt "$RUNNER_TEMP/inputs.check.txt"
          lake exe leanify flatten tests/Inputs/article.tex "$RUNNER_TEMP/flat.tex"
          lake exe leanify check "$RUNNER_TEMP/flat.tex" > "$RUNNER_TEMP/flat.check.txt" || true
          grep -q "2 definitions, 5 claims" "$RUNNER_TEMP/flat.check.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: A suggested rewrite of an unread sentence is kept only if the check reads it
        run: |
          cp examples/Demo/draft.tex "$RUNNER_TEMP/draft.tex"
          python scripts/leanify_suggest.py "$RUNNER_TEMP/draft.tex" --hook "python tests/suggest_hook.py" \
            --leanify .lake/build/bin/leanify > "$RUNNER_TEMP/suggest.txt"
          grep -q "kept 1 of 1 suggestions" "$RUNNER_TEMP/suggest.txt"
          grep -q "reads as: " "$RUNNER_TEMP/suggest.txt"
      - name: Every claim of the examples is verified
        run: |
          for a in examples/Demo examples/Means tests/TailDependence; do
            python scripts/leanify_diagnostics.py $a/article.leanify.json --strict --verified
          done
      - name: The steps of the test proofs are closed by the standard tactic, and no statement is empty
        run: |
          python scripts/leanify_diagnostics.py tests/Arguments/article.leanify.json --verified --standard --satisfiable > "$RUNNER_TEMP/arguments.txt"
          if grep -q "standard tactic does not close\|not shown to hold together" "$RUNNER_TEMP/arguments.txt"; then exit 1; fi
          python scripts/leanify_diagnostics.py examples/Means/article.leanify.json --standard > "$RUNNER_TEMP/means.txt"
          grep -q "proof step (claim 1) is derived in the text, but the standard tactic does not close it" "$RUNNER_TEMP/means.txt"
      - name: The kernel evaluates the compiler on the test articles (the audit)
        run: |
          for a in examples/Demo examples/Means tests/TailDependence tests/Refuted tests/Notation tests/Vocabulary \
              tests/Fields tests/Calculus tests/PDE tests/Conventions tests/Statements tests/Arguments tests/Notions; do
            lake exe leanify audit $a/article.tex
          done
      - name: The refuted theorem is reported false, and the claims resting on it unverified
        run: |
          if python scripts/leanify_diagnostics.py tests/Refuted/article.leanify.json > "$RUNNER_TEMP/refuted.txt"; then exit 1; fi
          grep -q "error: statement (claim 2) is false as stated" "$RUNNER_TEMP/refuted.txt"
          grep -q "(claim 5) compiled but not verified: it rests on claim 2, which is refuted" "$RUNNER_TEMP/refuted.txt"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reader tests
        run: npm test
      - name: Reports and dependency pins are up to date
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json examples tests
