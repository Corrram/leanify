name: Leanify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# The checks themselves are in scripts/ci.sh, which reads what to check from the
# repository (the libraries of lakefile.toml, every check.txt, every compiled article).
# A new test or a changed option needs no change of this file.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the checker and certify the articles
        run: bash scripts/ci.sh build
      - name: The articles are read as their expected outputs say
        run: bash scripts/ci.sh checks
      - name: The proofs are verified, standard, and not empty
        run: bash scripts/ci.sh proofs
      - name: The kernel evaluates the compiler on the articles (the audit)
        run: bash scripts/ci.sh audit
      - name: Reader tests
        run: bash scripts/ci.sh reader
      - name: Reports and dependency pins are up to date
        run: bash scripts/ci.sh clean
