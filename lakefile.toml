name = "leanify"
version = "0.9.0"
description = "Mathematical articles in LaTeX, compiled and checked by Lean"
license = "Apache-2.0"
defaultTargets = ["Leanify"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Leanify"
globs = ["Leanify.*"]

[[lean_lib]]
# A short paper on the harmonic, geometric and arithmetic mean: definitions inside a
# result, in a claim and after it.
name = "Means"
srcDir = "examples"
globs = ["Means.+"]

[[lean_lib]]
# A test of notions defined in the running text, with the unit-square vocabulary.
name = "TailDependence"
srcDir = "tests"
globs = ["TailDependence.+"]

[[lean_lib]]
# The demonstration article of docs/getting-started.md.
name = "Demo"
srcDir = "examples"
globs = ["Demo.+"]

[[lean_lib]]
# Notation beyond the core grammar, compiled by the kernel (a test of the compiler).
name = "Notation"
srcDir = "tests"
globs = ["Notation.+"]

[[lean_lib]]
# The demonstration article with a false theorem, refuted in Lean (a test of the
# `refuted` status and of claims that cite it).
name = "Refuted"
srcDir = "tests"
globs = ["Refuted.+"]

[[lean_lib]]
# The article's notation and conventions, and a field of the vocabulary
# (distributions on the natural numbers), compiled by the kernel.
name = "Vocabulary"
srcDir = "tests"
globs = ["Vocabulary.+"]

[[lean_lib]]
# The fields numbers and torus, generic constants and existence statements,
# compiled by the kernel.
name = "Fields"
srcDir = "tests"
globs = ["Fields.+"]

[[lean_lib]]
# The field combinatorics: counting numbers as notions with arguments.
name = "Combinatorics"
srcDir = "tests"
globs = ["Combinatorics.+"]

[[lean_lib]]
# The field arithmetic: arithmetic functions, perfect numbers, multiplicative functions.
name = "Arithmetic"
srcDir = "tests"
globs = ["Arithmetic.+"]

[[lean_lib]]
# The field polynomials: polynomials as real functions, modifiers with an argument (of degree n).
name = "Polynomials"
srcDir = "tests"
globs = ["Polynomials.+"]

[[lean_lib]]
# The field graphs: a type of its own, graphs on n vertices, k-regular graphs, the complement.
name = "Graphs"
srcDir = "tests"
globs = ["Graphs.+"]

[[lean_lib]]
# The field permutations: a type with an application to numbers, composition and the sign.
name = "Permutations"
srcDir = "tests"
globs = ["Permutations.+"]

[[lean_lib]]
# The field matrices: notation defined for matrices of matching sizes, the transpose, n×n matrices.
name = "Matrices"
srcDir = "tests"
globs = ["Matrices.+"]

[[lean_lib]]
# The field special: the gamma, beta and zeta functions with their domains, Bernoulli numbers.
name = "Special"
srcDir = "tests"
globs = ["Special.+"]

[[lean_lib]]
# The field realsets: sets of real numbers by a noun, adjectives of the core and of the field together.
name = "Topology"
srcDir = "tests"
globs = ["Topology.+"]

[[lean_lib]]
# The field realfunctions: real functions by a noun, their properties, `Every NP $x$ is ADJ`.
name = "Analysis"
srcDir = "tests"
globs = ["Analysis.+"]

[[lean_lib]]
# The field vectors: norms and inner products of a type of the vocabulary, a modifier with a vector.
name = "Vectors"
srcDir = "tests"
globs = ["Vectors.+"]

[[lean_lib]]
# The field geometry: points of the plane, `let $M$ be the NOTION`, figures as sets of points.
name = "Geometry"
srcDir = "tests"
globs = ["Geometry.+"]

[[lean_lib]]
# The field congruences: adjectives with numbers after `is` (congruent to $b$ modulo $n$).
name = "Congruences"
srcDir = "tests"
globs = ["Congruences.+"]

[[lean_lib]]
# The field groups: finite groups up to isomorphism, clauses joined by `or` and `if and only if`.
name = "Groups"
srcDir = "tests"
globs = ["Groups.+"]

[[lean_lib]]
# The field means: means of two numbers, each with its domain in the value and at each use.
name = "MeansField"
srcDir = "tests"
globs = ["MeansField.+"]

[[lean_lib]]
# The field densities: probability densities, standard densities with parameters, `M_f(t)`
# with the domain of `t`.
name = "Densities"
srcDir = "tests"
globs = ["Densities.+"]

[[lean_lib]]
# The field fourier: Fourier coefficients, partial sums, kernels, transforms.
name = "Fourier"
srcDir = "tests"
globs = ["Fourier.+"]

[[lean_lib]]
# The field information: entropy and divergences of distributions on ℕ₀.
name = "Information"
srcDir = "tests"
globs = ["Information.+"]

[[lean_lib]]
# The field optimization: `$x$ is a local minimizer of $f$` (a modifier with a function),
# extreme values as descriptions, the convex conjugate.
name = "Optimization"
srcDir = "tests"
globs = ["Optimization.+"]

[[lean_lib]]
# The field dynamics: iterates, fixed and periodic points, the least period.
name = "Dynamics"
srcDir = "tests"
globs = ["Dynamics.+"]

[[lean_lib]]
# A revised article: changes marked by a conditional (`\newif`), definitions inside the
# sentences of a running text, decorations with a star.
name = "Revision"
srcDir = "tests"
globs = ["Revision.+"]

[[lean_lib]]
# Couplings and random pairs with the field unitsquare: expectations of the coordinates,
# the copula of a coupling, dual certificates, a rearrangement inequality.
name = "Couplings"
srcDir = "tests"
globs = ["Couplings.+"]

[[lean_lib]]
# The freer wordings of a research article: definitions inside prose, after a colon and after
# `, where`, letters introduced by earlier definitions, values attained only by an object.
name = "Wordings"
srcDir = "tests"
globs = ["Wordings.+"]

[[lean_lib]]
# Functions of several variables and partial derivatives, compiled by the kernel.
name = "Calculus"
srcDir = "tests"
globs = ["Calculus.+"]

[[lean_lib]]
# Fields, function spaces, norms and the Navier–Stokes equations, compiled by the kernel.
name = "PDE"
srcDir = "tests"
globs = ["PDE.+"]

[[lean_lib]]
# Conventions about constants and their dependence, multi-indices, quantities set for
# every value of a parameter, and classes of functions and of families, compiled by
# the kernel.
name = "Conventions"
srcDir = "tests"
globs = ["Conventions.+"]

[[lean_lib]]
# Statement forms found in OpenAI's collection of AI-written manuscripts, compiled by
# the kernel.
name = "Statements"
srcDir = "tests"
globs = ["Statements.+"]

[[lean_lib]]
# Notions that an article uses without defining them (declared in its preamble, or
# introduced by a sentence) and results that it quotes from the literature, compiled by
# the kernel and certified: the quoted results are the axioms of the certificate.
name = "Undefined"
srcDir = "tests"
globs = ["Undefined.+"]

[[lean_lib]]
# Claims that follow a sentence which is not read (a hypothesis that is missing, a case
# or a supposition that has ended): verified as read, named and counted apart.
name = "Context"
srcDir = "tests"
globs = ["Context.+"]

[[lean_lib]]
# The language of proofs: assumptions, cases written as the items of a list,
# contradictions and induction, compiled by the kernel and certified, each step by the
# standard tactic.
name = "Arguments"
srcDir = "tests"
globs = ["Arguments.+"]

[[lean_lib]]
# Notions of the running text and the adjectives of the unit-square field, with the
# model that the vocabulary names (no proofs: the statements are compiled and stated).
name = "Notions"
srcDir = "tests"
globs = ["Notions.+"]

[[lean_lib]]
# The type `[0,1]` of the field unitsquare: points, integrals, Lebesgue measure and the
# law of a pair (no proofs: the statements are compiled and stated).
name = "Square"
srcDir = "tests"
globs = ["Square.+"]

[[lean_lib]]
# A definition without a proof that it is well defined: the certificate assumes it and
# names the assumption (a test of `Foo.Assumed.wellDefinedI`).
name = "Assumed"
srcDir = "tests"
globs = ["Assumed.+"]

[[lean_lib]]
# Reasons in words, restatements and objects chosen in proofs, compiled by the kernel.
name = "Steps"
srcDir = "tests"
globs = ["Steps.+"]

[[lean_lib]]
# The fields hilbert and markov: operators on L^2, their powers and norms, and the Markov
# operator of a copula, compiled by the kernel.
name = "Operators"
srcDir = "tests"
globs = ["Operators.+"]

[[lean_lib]]
# The steps of `definedness` and the facts of the unit square about couplings, each on a
# leaf in the form the compiled statements have it.
name = "TacticSteps"
srcDir = "tests"
globs = ["TacticSteps"]

[[lean_exe]]
name = "leanify"
root = "LeanifyCli"

[[lean_exe]]
# `lake exe glossary > docs/glossary.md`: the glossary of the vocabulary.
name = "glossary"
root = "GlossaryMain"

[[lean_lib]]
# The field asymptotics: `$f$ is dominated by $g$`, `of the same order as`, regular variation.
name = "Asymptotics"
srcDir = "tests"
globs = ["Asymptotics.+"]

[[lean_lib]]
# The field transforms: Laplace, Mellin and Stieltjes transforms, convolution, defined where integrable.
name = "Transforms"
srcDir = "tests"
globs = ["Transforms.+"]

[[lean_lib]]
# The field calculus: higher derivatives, Taylor polynomials, arc length, average value, areas.
name = "CalculusField"
srcDir = "tests"
globs = ["CalculusField.+"]

[[lean_lib]]
# The field risk: survival function, hazard rate, quantiles, value at risk, expected shortfall.
name = "Risk"
srcDir = "tests"
globs = ["Risk.+"]

[[lean_lib]]
# The field stochasticorders: `$f$ is smaller than $g$ in the likelihood ratio order`.
name = "StochasticOrders"
srcDir = "tests"
globs = ["StochasticOrders.+"]

[[lean_lib]]
# The field finance: interest, annuities, Black-Scholes prices with five arguments.
name = "Finance"
srcDir = "tests"
globs = ["Finance.+"]

[[lean_lib]]
# The field topologies: topologies on R, `$\tau$-open`, the cofinite and lower limit topologies.
name = "Topologies"
srcDir = "tests"
globs = ["Topologies.+"]

[[lean_lib]]
# The field metricspaces: metrics on R, induced topologies, Cauchy sequences, contractions.
name = "MetricSpaces"
srcDir = "tests"
globs = ["MetricSpaces.+"]

[[lean_lib]]
# The field approximation: errors, difference quotients, quadrature rules, interpolation.
name = "Approximation"
srcDir = "tests"
globs = ["Approximation.+"]

[[lean_lib]]
# The field iteration: Newton's method, fixed-point sequences, orders of convergence.
name = "Iteration"
srcDir = "tests"
globs = ["Iteration.+"]

[[lean_lib]]
# The field odesolvers: initial value problems, Euler, Heun and Runge-Kutta steps.
name = "OdeSolvers"
srcDir = "tests"
globs = ["OdeSolvers.+"]

[[lean_lib]]
# The field series: summability, sums of series and power series, limits of sequences.
name = "Series"
srcDir = "tests"
globs = ["Series.+"]

[[lean_lib]]
# The field integration: L^p norms, essential supremum, improper integrals, integrals on sets.
name = "Integration"
srcDir = "tests"
globs = ["Integration.+"]

[[lean_lib]]
# The field planegeometry: lines, triangle centres, conics by their foci.
name = "PlaneGeometry"
srcDir = "tests"
globs = ["PlaneGeometry.+"]

[[lean_lib]]
# The field matrixnorms: matrix norms, condition numbers, diagonal dominance.
name = "MatrixNorms"
srcDir = "tests"
globs = ["MatrixNorms.+"]

[[lean_lib]]
# The field specialnumbers: kinds of primes and integers, Fermat and Mersenne numbers.
name = "SpecialNumbers"
srcDir = "tests"
globs = ["SpecialNumbers.+"]

[[lean_lib]]
# The field recurrences: progressions, the Fibonacci and linear recurrences.
name = "Recurrences"
srcDir = "tests"
globs = ["Recurrences.+"]

[[lean_lib]]
# The field copulas: copula families, measures of concordance and dependence.
name = "Copulas"
srcDir = "tests"
globs = ["Copulas.+"]

[[lean_lib]]
# More of the field densities: lognormal, Student t, Rayleigh, Gumbel, generalized Pareto, triangular.
name = "MoreDensities"
srcDir = "tests"
globs = ["MoreDensities.+"]

[[lean_lib]]
# The field orthogonalpolynomials: Legendre, Hermite, Laguerre, Chebyshev.
name = "OrthogonalPolynomials"
srcDir = "tests"
globs = ["OrthogonalPolynomials.+"]

[[lean_lib]]
# The field counting: subsets, maps, surjections, compositions, lattice paths.
name = "Counting"
srcDir = "tests"
globs = ["Counting.+"]

[[lean_lib]]
# The field samples: descriptive statistics of the first n terms of a sequence.
name = "Samples"
srcDir = "tests"
globs = ["Samples.+"]

[[lean_lib]]
# More of the field distributions: geometric, Bernoulli, uniform; variance and generating function.
name = "MoreDistributions"
srcDir = "tests"
globs = ["MoreDistributions.+"]

[[lean_lib]]
# The field timeseries: autocovariance, moving averages, differences, smoothing.
name = "TimeSeries"
srcDir = "tests"
globs = ["TimeSeries.+"]

[[lean_lib]]
# The field testing: test statistics, p-values, quantiles, margins of error.
name = "Testing"
srcDir = "tests"
globs = ["Testing.+"]

[[lean_lib]]
# The field descent: line searches and descent sequences.
name = "Descent"
srcDir = "tests"
globs = ["Descent.+"]

[[lean_lib]]
# The field functionalequations: Cauchy's and Jensen's equations and inequalities.
name = "FunctionalEquations"
srcDir = "tests"
globs = ["FunctionalEquations.+"]

[[lean_lib]]
# The field convexity: generalized convexity and Hermite-Hadamard.
name = "Convexity"
srcDir = "tests"
globs = ["Convexity.+"]

[[lean_lib]]
# The field fractional: fractional integrals and derivatives.
name = "Fractional"
srcDir = "tests"
globs = ["Fractional.+"]

[[lean_lib]]
# The field utility: expected utility and risk aversion.
name = "Utility"
srcDir = "tests"
globs = ["Utility.+"]

[[lean_lib]]
# The field markovchains: finite Markov chains by transition matrices.
name = "MarkovChains"
srcDir = "tests"
globs = ["MarkovChains.+"]

[[lean_lib]]
# The field curves: plane curves, curvature, length and area.
name = "Curves"
srcDir = "tests"
globs = ["Curves.+"]

[[lean_lib]]
# The field continuedfractions: continued fractions and Diophantine approximation.
name = "ContinuedFractions"
srcDir = "tests"
globs = ["ContinuedFractions.+"]

[[lean_lib]]
# The field digits: base-b digits of natural numbers.
name = "Digits"
srcDir = "tests"
globs = ["Digits.+"]

[[lean_lib]]
# The field branching: Galton-Watson processes.
name = "Branching"
